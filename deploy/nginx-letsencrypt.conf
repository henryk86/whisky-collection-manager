# Optional public HTTPS endpoint. The app stays on verified, self-signed
# HTTPS internally, preserving the backup worker's loopback TLS connection.
server {
    listen 8443 ssl;
    server_name _;
    server_tokens off;
    ssl_certificate /etc/nginx/wcm-letsencrypt/current/fullchain.pem;
    ssl_certificate_key /etc/nginx/wcm-letsencrypt/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 2g;

    location / {
        proxy_pass https://app:3543;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_ssl_trusted_certificate /etc/nginx/wcm-certs/server-cert.pem;
        proxy_ssl_verify on;
        proxy_ssl_name localhost;
        proxy_ssl_server_name on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
