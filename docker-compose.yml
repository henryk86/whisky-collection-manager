name: whisky-collection-manager

services:
  app:
    image: ghcr.io/henryk86/whisky-collection-manager:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      WHISKY_DATA_DIR: /srv/whisky
      HTTP_ENABLED: 'false'
      HTTPS_ENABLED: 'true'
      HTTPS_PORT: '3543'
      HTTPS_CERT_FILE: /run/certs/server-cert.pem
      HTTPS_KEY_FILE: /run/certs/server-key.pem
      # Interner Zugriff des Backup-Prozesses nur auf die HTTPS-Loopback-Adresse.
      APP_INTERNAL_URL: https://127.0.0.1:3543
      NODE_EXTRA_CA_CERTS: /run/certs/server-cert.pem
      BACKUP_CONTROL_DIR: /backup-control
      BACKUP_TARGET_ROOT: /backup-targets
      BACKUP_ADMIN_TOKEN_FILE: /run/secrets/backup-admin-token
      BACKUP_WORKER_TOKEN_FILE: /run/secrets/backup-worker-token
      RESTIC_PASSWORD_FILE: /run/secrets/restic-password
      RCLONE_CONFIG: /config/rclone/rclone.conf
      BACKUP_TIME_ZONE: ${TZ:-Europe/Berlin}
      HOME: /backup-control/home
      # Optional: geocoding service can be switched without rebuilding the image.
      OSM_GEOCODING_URL: ${OSM_GEOCODING_URL:-https://nominatim.openstreetmap.org/search}
      TZ: ${TZ:-Europe/Berlin}
      # Certificate SAN values also define the default HTTP Host allowlist.
      CERT_DNS_NAMES: ${CERT_DNS_NAMES:-}
      CERT_IP_ADDRESSES: ${CERT_IP_ADDRESSES:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      EXTENSION_IDS: ${EXTENSION_IDS:-}
    ports:
      - '3543:3543'
    volumes:
      - ${WCM_DATA_DIR:?Run sh deploy/setup-pi.sh first}/storage:/srv/whisky
      - ${WCM_DATA_DIR:?Run sh deploy/setup-pi.sh first}/backup-control:/backup-control
      - ${WCM_DATA_DIR:?Run sh deploy/setup-pi.sh first}/backup-targets:/backup-targets
      - ${WCM_DATA_DIR:?Run sh deploy/setup-pi.sh first}/rclone:/config/rclone
      - ${WCM_DATA_DIR:?Run sh deploy/setup-pi.sh first}/secrets/certs:/run/certs:ro
      - ${WCM_DATA_DIR:?Run sh deploy/setup-pi.sh first}/secrets/backup-admin-token:/run/secrets/backup-admin-token:ro
      - ${WCM_DATA_DIR:?Run sh deploy/setup-pi.sh first}/secrets/backup-worker-token:/run/secrets/backup-worker-token:ro
      - ${WCM_DATA_DIR:?Run sh deploy/setup-pi.sh first}/secrets/restic-password:/run/secrets/restic-password:ro
      - ${WCM_DATA_DIR:?Run sh deploy/setup-pi.sh first}/secrets/ssh:/home/node/.ssh:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("https://127.0.0.1:3543/api/version").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 3
