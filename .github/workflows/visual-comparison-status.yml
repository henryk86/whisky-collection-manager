name: Visual Comparison Status

on:
  workflow_run:
    workflows: [Visual Comparison]
    types: [in_progress, completed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

jobs:
  invalidate:
    concurrency:
      group: visual-approval-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
      cancel-in-progress: false
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.action == 'in_progress' ||
       github.event.workflow_run.conclusion != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Invalidate previous visual approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/visual-approval.py --invalidate
