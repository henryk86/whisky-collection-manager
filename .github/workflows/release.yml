name: Release (main -> GitHub Release -> ZIP + GHCR)

# The same workflow builds artifacts for a newly merged main version and for
# releases published manually. Releases created with GITHUB_TOKEN do NOT emit
# another workflow run, so create/build/publish must happen in this run.
on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On a manually published release, use exactly the release tag.
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Validate version files and release tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          node scripts/release-version.js check
          tag="$(node scripts/release-version.js tag)"
          if [ "$EVENT_NAME" = release ] && [ "$RELEASE_TAG" != "$tag" ]; then
            echo "Published release $RELEASE_TAG does not match package version $tag" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = release ]; then
            git fetch origin +refs/heads/main:refs/remotes/origin/main --no-tags
            git merge-base --is-ancestor HEAD origin/main || {
              echo 'The release must be based on a commit merged into main.' >&2
              exit 1
            }
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run verify
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
      - name: Create or reuse draft release (push to main only)
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # A retry may find a tag and draft left by a failed run. Only ever
          # reuse it when it references precisely this merge commit.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$TAG")"
            test "$tag_sha" = "$GITHUB_SHA" || {
              echo "Tag $TAG already belongs to another commit" >&2
              exit 1
            }
          else
            node scripts/release-version.js check --fresh
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi
          if gh release view "$TAG" --json isDraft --jq .isDraft > /tmp/release-draft 2>/dev/null; then
            test "$(cat /tmp/release-draft)" = true || {
              echo "Release $TAG was already published; refusing to republish it" >&2
              exit 1
            }
          else
            gh release create "$TAG" --verify-tag --draft \
              --title "$TAG" --generate-notes
          fi

  package:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - name: Build reproducible release ZIP from the tagged commit
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          archive="whisky-collection-manager-${TAG}.zip"
          mkdir -p dist
          git archive --format=zip --output="dist/$archive" "$TAG"
          unzip -t "dist/$archive" >/dev/null
          # Explicit check against accidentally tracked runtime credentials/data.
          unzip -Z1 "dist/$archive" | node scripts/verify-release-files.js
          (cd dist && sha256sum "$archive" > "$archive.sha256")
      - name: Upload versioned ZIP and SHA256 to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber

  docker:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Set lowercase GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.prepare.outputs.tag }}
            ${{ steps.image.outputs.name }}:${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Check published image can load its package config on both architectures
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$IMAGE:$TAG"
            actual="$(docker run --rm --platform "$platform" --entrypoint node "$IMAGE:$TAG" -p 'require("/app/package.json").version')"
            if [ "$actual" != "$EXPECTED_VERSION" ]; then
              echo "$platform: image package version $actual != expected $EXPECTED_VERSION" >&2
              exit 1
            fi
            docker run --rm --platform "$platform" --entrypoint node "$IMAGE:$TAG" --check /app/docker/entrypoint.js
            # All runtime dependencies must exist inside both published platform variants.
            docker run --rm --platform "$platform" --entrypoint /bin/sh "$IMAGE:$TAG" \
              -c 'node --version && restic version && rclone version && ssh -V'
            echo "$platform: package.json, entrypoint and backup tools are valid ($actual)"
          done

  publish:
    # Promote `latest` only after the versioned image and release ZIP have succeeded.
    needs: [prepare, package, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote versioned multiarch image to latest
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:latest" "$image:$TAG"
      - name: Publish completed draft release (main merge only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
