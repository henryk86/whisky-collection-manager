name: Release (merge develop -> main)

# A human-approved develop -> main merge triggers a tagged release.
# After artifact checks, only a release-version PR may be merged by the bot.
# Protected main is never updated by a direct push or force push.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      kind: ${{ steps.origin.outputs.kind }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Identify approved develop merge or release-version PR merge
        id: origin
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/pulls" \
            --jq '.[] | @json' | node scripts/verify-merged-pr.js

  prepare:
    needs: gate
    if: needs.gate.outputs.kind == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify the merged develop pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Main is a protected branch in this public repository.
          # Always verify the actual merged develop PR, independent of branch protection.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/pulls" \
            --jq '.[] | @json' | node scripts/verify-merged-pr.js
      - name: Analyze commits from the approved develop merge
        run: node scripts/release-automation.js plan --json
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run verify
      - run: npm run test:browser
      - name: Create or reuse versioned release snapshot and draft
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-automation.js snapshot --output "$RUNNER_TEMP/wcm-release"
          source "$RUNNER_TEMP/wcm-release/release-info.txt"
          # Prepare the versioned tag before packaging; main and develop
          # are only advanced together after every release artifact passes.
          git checkout --detach "$tag"
          node scripts/release-version.js check
          npm run check
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git push origin "refs/tags/$tag"
          if gh release view "$tag" --json isDraft --jq .isDraft > /tmp/release-draft 2>/dev/null; then
            test "$(cat /tmp/release-draft)" = true || {
              echo "Release $tag already published; refusing to republish" >&2
              exit 1
            }
          else
            gh release create "$tag" --verify-tag --draft \
              --title "$tag" --notes-file "$RUNNER_TEMP/wcm-release/release-notes.md" \
              --repo "$GITHUB_REPOSITORY"
          fi

  package:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
      - name: Build reproducible release ZIP from the tagged commit
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          archive="whisky-collection-manager-${TAG}.zip"
          mkdir -p dist
          git archive --format=zip --output="dist/$archive" "$TAG"
          unzip -t "dist/$archive" >/dev/null
          # Explicit check against accidentally tracked runtime credentials/data.
          unzip -Z1 "dist/$archive" | node scripts/verify-release-files.js
          (cd dist && sha256sum "$archive" > "$archive.sha256")
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build and verify fully offline installation ZIP
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          source_zip="dist/whisky-collection-manager-${TAG}.zip"
          offline_zip="whisky-collection-manager-${TAG}-offline.zip"
          build_dir="$(mktemp -d)"
          check_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir" "$check_dir"' EXIT
          unzip -q "$source_zip" -d "$build_dir"
          (
            cd "$build_dir"
            npm ci --ignore-scripts --no-audit --no-fund --cache .offline/npm-cache
            node scripts/prepare-cutout-assets.js
            node scripts/prepare-cutout-assets.js --verify
            node scripts/offline-bundle.js seal
            rm -rf node_modules
            # The release contains source, npm tarball cache and AI binaries;
            # it intentionally contains no private data, certs or runtime state.
            zip -q -r "$GITHUB_WORKSPACE/dist/$offline_zip" .
          )
          unzip -t "dist/$offline_zip" >/dev/null
          unzip -q "dist/$offline_zip" -d "$check_dir"
          (
            cd "$check_dir"
            node scripts/offline-bundle.js verify
            # Force npm completely offline and exercise the real startup path.
            HTTPS_ENABLED=false npm_config_offline=true node --input-type=module -e               'import { prepareStartup } from "./scripts/start.js"; prepareStartup({env:{...process.env, HTTPS_ENABLED:"false"}});'
            node scripts/prepare-cutout-assets.js --verify
            node -e "require.resolve('three'); require.resolve('html5-qrcode');"
          )
          (cd dist && sha256sum "$offline_zip" > "$offline_zip.sha256")
      - name: Upload source and offline ZIPs and SHA256 to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" dist/*.zip dist/*.sha256 --clobber --repo "$GITHUB_REPOSITORY"

  docker:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - name: Set lowercase GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          provenance: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.prepare.outputs.tag }}
            ${{ steps.image.outputs.name }}:${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Check published image can load its package config on both architectures
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          TAG: ${{ needs.prepare.outputs.tag }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          for platform in linux/amd64 linux/arm64; do
            docker pull --platform "$platform" "$IMAGE:$TAG"
            actual="$(docker run --rm --platform "$platform" --entrypoint node "$IMAGE:$TAG" -p 'require("/app/package.json").version')"
            if [ "$actual" != "$EXPECTED_VERSION" ]; then
              echo "$platform: image package version $actual != expected $EXPECTED_VERSION" >&2
              exit 1
            fi
            docker run --rm --platform "$platform" --entrypoint node "$IMAGE:$TAG" --check /app/docker/entrypoint.js
            # All runtime dependencies must exist inside both published platform variants.
            docker run --rm --platform "$platform" --entrypoint /bin/sh "$IMAGE:$TAG" \
              -c 'node --version && restic version && rclone version && ssh -V'
            echo "$platform: package.json, entrypoint and backup tools are valid ($actual)"
          done

  docker-offline:
    needs: [prepare, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Save and verify installable ARM64 and AMD64 images
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$TAG"
          mkdir -p dist
          for arch in arm64 amd64; do
            platform="linux/$arch"
            archive="whisky-collection-manager-${TAG}-linux-${arch}.tar.gz"
            docker pull --platform "$platform" "$image"
            # Docker 28+ saves just the requested architecture, not an accidental
            # host-architecture image with the same tag.
            docker image save --platform "$platform" "$image" | gzip -n > "dist/$archive"
            test -s "dist/$archive"
            gzip -t "dist/$archive"
            (cd dist && sha256sum "$archive" > "$archive.sha256")
            # Verify the actual tar archive can be reimported without a registry.
            docker image rm "$image"
            gzip -dc "dist/$archive" | docker load
            docker run --rm --network none --platform "$platform" --entrypoint /bin/sh "$image"               -c 'node scripts/prepare-cutout-assets.js --verify && restic version && rclone version'
          done
      - name: Upload self-contained Docker archives
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        # This job deliberately has no checkout, so gh cannot infer its
        # repository from .git. Set it explicitly via the Actions environment.
        run: gh release upload "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber --repo "$GITHUB_REPOSITORY"

  publish:
    # Promote `latest` only after source, offline package and both image archives succeed.
    needs: [prepare, package, docker, docker-offline]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Create and merge trusted version PR into protected main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WCM_RELEASE_PR_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          APPROVED_MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/merge-version-pr.js "$RELEASE_TAG" "$APPROVED_MERGE_SHA"
      - name: Synchronize develop after protected main was merged
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          APPROVED_MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/sync-release-branches.js finish --tag "$RELEASE_TAG" --merge "$APPROVED_MERGE_SHA"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote versioned multiarch image to latest
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:latest" "$image:$TAG"
      - name: Publish completed draft release (main merge only)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
