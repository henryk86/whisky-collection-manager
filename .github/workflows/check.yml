name: Checks

# Development builds on develop; review-gated release candidate on PR to main.
on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Enforce documentation review for code changes
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.base_ref == 'develop')
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DOCS_DECLARATION: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/check-doc-impact.js --range "$PR_BASE_SHA..HEAD"
          elif git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            node scripts/check-doc-impact.js --range "$PUSH_BEFORE..HEAD"
          else
            node scripts/check-doc-impact.js --range "HEAD^..HEAD"
          fi
      - run: npm run check
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:browser
      - name: Locate pinned Playwright Chromium for visual regression
        if: github.event_name == 'pull_request' && !cancelled()
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(node --input-type=module -e 'import { chromium } from "playwright-core"; process.stdout.write(chromium.executablePath())')"
          test -x "$CHROME_PATH"
          echo "WCM_VISUAL_BROWSER_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Compare designsystem screenshots and geometry (read-only baselines)
        if: github.event_name == 'pull_request' && !cancelled()
        run: npm run test:visual
      - name: Upload designsystem visual report and failure diffs
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: design-system-visual-${{ github.run_id }}
          path: test-artifacts/designsystem-visual/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload browser regression artifacts on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: browser-regressions-${{ github.run_id }}
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Validate directly pushed develop commits
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            node scripts/release-automation.js validate --range "$PUSH_BEFORE..HEAD"
          else
            node scripts/release-automation.js validate --range "HEAD^..HEAD"
          fi
      - name: Validate future pull requests to develop
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        run: node scripts/release-automation.js validate --range "HEAD^1..HEAD^2"
      - name: Validate develop release or the trusted version-only PR to main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          PR_SOURCE: ${{ github.head_ref }}
          PR_SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PR_SOURCE_REPO" = "$GITHUB_REPOSITORY" || {
            echo 'Pull requests to main must originate in this repository.' >&2
            exit 1
          }
          if [ "$PR_SOURCE" = develop ]; then
            node scripts/release-automation.js plan --json
          else
            node scripts/verify-version-pr.js
          fi
