name: Checks

# Development builds on develop; review-gated release candidate on PR to main.
on:
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check project, Google JavaScript style and JSDoc
        run: npm run check
      - run: npx playwright-core install --with-deps chromium
      - run: npm test
      - name: Test visual approval controller
        run: python3 -B -m unittest discover -s tests/unit -p visual_approval_test.py
      - run: npm run test:browser
      - name: Upload browser regression artifacts on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: browser-regressions-${{ github.run_id }}
          path: test-artifacts/
          if-no-files-found: warn
          retention-days: 14
      - name: Validate directly pushed develop commits
        if: github.event_name == 'push'
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            node scripts/release-automation.js validate --range "$PUSH_BEFORE..HEAD"
          else
            node scripts/release-automation.js validate --range "HEAD^..HEAD"
          fi
      - name: Validate future pull requests to develop
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        run: node scripts/release-automation.js validate --range "HEAD^1..HEAD^2"
      - name: Validate develop release or the trusted version-only PR to main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          PR_SOURCE: ${{ github.head_ref }}
          PR_SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PR_SOURCE_REPO" = "$GITHUB_REPOSITORY" || {
            echo 'Pull requests to main must originate in this repository.' >&2
            exit 1
          }
          if [ "$PR_SOURCE" = develop ]; then
            node scripts/release-automation.js plan --json
          else
            node scripts/verify-version-pr.js
          fi
