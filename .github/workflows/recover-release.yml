name: Recover previously built draft release

# One-time repair if an earlier release failed only at the protected-main sync.
# Normal releases still start automatically from the human develop -> main merge.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing draft tag, e.g. v1.4.1'
        required: true
        type: string
      approved_merge_sha:
        description: '40-character SHA of the original approved develop -> main merge'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Verify original approved merge and complete draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ inputs.approved_merge_sha }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}/pulls" \
            --jq '.[] | @json' | node scripts/verify-merged-pr.js --require-release
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > "$RUNNER_TEMP/draft.json"
          node --input-type=module - "$RUNNER_TEMP/draft.json" "$TAG" <<'JS'
          import fs from 'node:fs';
          const [file,tag]=process.argv.slice(2);
          const {isDraft,assets}=JSON.parse(fs.readFileSync(file,'utf8'));
          if(!isDraft) throw new Error('Release is not a draft; refusing recovery');
          const names=new Set(assets.map(a=>a.name));
          for(const suffix of ['.zip','.zip.sha256','-offline.zip','-offline.zip.sha256','-linux-amd64.tar.gz','-linux-amd64.tar.gz.sha256','-linux-arm64.tar.gz','-linux-arm64.tar.gz.sha256']) {
            const prefix=`whisky-collection-manager-${tag}`;
            if(!names.has(prefix+suffix)) throw new Error(`Draft missing ${prefix+suffix}`);
          }
          JS
          # The tagged snapshot must be the exact version from the original merge.
          node scripts/sync-release-branches.js prepare --tag "$TAG" --merge "$MERGE_SHA"
      - name: Merge only the trusted version PR through protected main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.WCM_RELEASE_PR_TOKEN || github.token }}
          TAG: ${{ inputs.tag }}
          MERGE_SHA: ${{ inputs.approved_merge_sha }}
        run: |
          set -euo pipefail
          node scripts/merge-version-pr.js "$TAG" "$MERGE_SHA"
      - name: Synchronize develop after GitHub merged the version PR
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          MERGE_SHA: ${{ inputs.approved_merge_sha }}
        run: |
          set -euo pipefail
          node scripts/sync-release-branches.js finish --tag "$TAG" --merge "$MERGE_SHA"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the already validated versioned image to latest
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag "$image:latest" "$image:$TAG"
      - name: Publish the completed draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
