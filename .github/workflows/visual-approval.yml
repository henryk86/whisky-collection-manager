name: Visual Approval Controller

on:
  workflow_run:
    workflows: [Visual Comparison]
    types: [in_progress, completed]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: write
  statuses: write

jobs:
  review:
    concurrency:
      group: visual-approval-${{ github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
      cancel-in-progress: false
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'pull_request' &&
       (github.event.action == 'in_progress' ||
        github.event.workflow_run.conclusion == 'success')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       (github.event.action != 'created' ||
        startsWith(github.event.comment.body, '/visual-approve')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run and issue_comment run on the trusted default branch.
      # Never check out or execute the PR in this write-enabled workflow.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Process review data and authorized comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/visual-approval.py
