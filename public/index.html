    <script>
        // Apply the saved theme before CSS loads to avoid a flash of the wrong theme.
        try {
            const saved = localStorage.getItem('whisky-theme');
            const systemTheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            const mode = saved === 'light' || saved === 'dark' ? saved : systemTheme;
            document.documentElement.dataset.theme = mode;
            document.documentElement.style.colorScheme = mode;
        } catch {
            // Restricted storage must not prevent the application from loading.
        }
    </script>
