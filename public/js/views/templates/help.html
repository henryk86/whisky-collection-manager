<!-- wcm-template:helpDescription -->
<p class="help-description muted">{{text:description}}</p>
<!-- /wcm-template -->

<!-- wcm-template:li -->
<li>{{text:t}}</li>
<!-- /wcm-template -->

<!-- wcm-template:helpSection -->

        <section class="help-section" id="help-panel-{{raw:id}}" aria-labelledby="help-title-{{raw:id2}}"{{raw:id3}}>
            {{raw:headingTitle}}
            <div class="help-content-panel">
                {{raw:helpDescription}}
                <ol class="help-steps">{{raw:from}}</ol>{{raw:helpGuides}}
            </div>
        </section>
<!-- /wcm-template -->

<!-- wcm-template:helpPanels -->
<div class="help-panels">{{raw:panels}}</div>
<!-- /wcm-template -->

<!-- wcm-template:analyticsPage -->
<div class="analytics-page help-page">
        {{raw:pageHeader}}
        {{raw:workspace}}
    </div>
<!-- /wcm-template -->
