<!-- wcm-template:warehouseBottleFact -->
<span class="warehouse-bottle-fact"><span class="warehouse-bottle-fact-label">{{raw:safe}}:</span> {{raw:safe2}}</span>
<!-- /wcm-template -->

<!-- wcm-template:warehouseShelfDetailBottle -->
<article class="warehouse-shelf-detail-bottle" data-bottle-id="{{raw:safe}}">
                {{raw:bottleSymbol}}
                <div class="warehouse-shelf-detail-info"><strong>{{raw:safe2}}</strong><div class="warehouse-bottle-facts">{{raw:facts}}{{raw:bottleListFacts}}</div>
  </div>
                {{raw:actionToolbar}}
             </article>
<!-- /wcm-template -->

<!-- wcm-template:warehouseShelfDetailGrid -->
<div class="warehouse-shelf-detail-grid">{{raw:bottles}}</div>
<!-- /wcm-template -->

<!-- wcm-template:hint -->
<p class="hint">{{t:warehouse.shelves.empty}}</p>
<!-- /wcm-template -->

<!-- wcm-template:warehouseShelfDetails -->
<div class="warehouse-shelf-details">
  <p>{{raw:bottleCount}}</p>{{raw:body}}</div>
<!-- /wcm-template -->
