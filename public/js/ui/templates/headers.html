<!-- wcm-template:actions -->
<div class="actions ds-header-actions{{raw:className}}">{{raw:content}}</div>
<!-- /wcm-template -->

<!-- wcm-template:headingPeriod -->
<span class="heading-period" aria-hidden="true">.</span>
<!-- /wcm-template -->

<!-- wcm-template:h -->
<h{{raw:level}}{{raw:classes}}{{raw:id}}>{{text:title}}{{raw:headingPeriod}}{{raw:trailingAction}}</h{{raw:level2}}>
<!-- /wcm-template -->

<!-- wcm-template:copyP -->
<p class="{{text:descriptionClass}}">{{text:description}}</p>
<!-- /wcm-template -->

<!-- wcm-template:copyDiv -->
<div class="{{raw:copyClass}}">{{raw:heading}}{{raw:p}}</div>
<!-- /wcm-template -->

<!-- wcm-template:sectionHeaderDiv -->
<div class="{{raw:layout}} ds-section-header{{raw:className}}">{{raw:copy}}{{raw:actionsBare}}</div>
<!-- /wcm-template -->

<!-- wcm-template:eyebrow -->
<span class="eyebrow dark">{{text:eyebrow}}</span>
<!-- /wcm-template -->

<!-- wcm-template:intro -->
<p class="intro">{{text:intro}}</p>
<!-- /wcm-template -->

<!-- wcm-template:header -->
<header class="{{raw:classes}}"><div{{raw:copyClass}}>{{raw:eyebrow}}{{raw:preTitle}}{{raw:headingTitle}}{{raw:intro}}</div>{{raw:actions}}</header>
<!-- /wcm-template -->

<!-- wcm-template:dsBackNav -->
<nav class="ds-back-nav ds-back-nav--page-action" aria-label="{{raw:text}}"><button type="button" class="btn ds-back-button ds-back-button--page-action" {{raw:attr}}>{{raw:arrowLeftIcon}}<span>{{raw:text2}}</span></button></nav>
<!-- /wcm-template -->

<!-- wcm-template:pageBackNav -->
<nav class="page-back-nav ds-back-nav ds-back-nav--inline" aria-label="{{raw:text}}"><button type="button" class="inline-link page-back ds-back-button ds-back-button--inline" {{raw:attr}}>{{raw:arrowLeftIcon}}<span>{{raw:text2}}</span></button></nav>
<!-- /wcm-template -->

<!-- wcm-template:dsHelpIconButton -->
<button type="button" class="ds-help-icon-button flight-plan-help-button" data-act="{{text:action}}" aria-label="{{raw:text}}" title="{{raw:text2}}"{{raw:disabled}}>{{raw:helpCircleIcon}}</button>
<!-- /wcm-template -->
