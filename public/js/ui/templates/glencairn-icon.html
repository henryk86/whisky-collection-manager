<!-- wcm-template:glencairnSymbol -->
<svg class="glencairn-symbol" viewBox="130 50 220 355" {{raw:accessible}}>{{raw:children}}</svg>
<!-- /wcm-template -->

<!-- wcm-template:defs -->
<defs><clipPath id="{{raw:id}}"><rect x="130" y="{{raw:y}}" width="220" height="{{raw:content}}"/></clipPath></defs>
<!-- /wcm-template -->

<!-- wcm-template:glencairnLiquid -->
<path class="glencairn-liquid" d="{{raw:gLENCAIRNCAVITY}}" style="fill:{{raw:liquidColor}}"/>
<!-- /wcm-template -->

<!-- wcm-template:glencairnInk -->
<path class="glencairn-ink" d="{{raw:gLENCAIRNINK}}" fill-rule="evenodd"/>
<!-- /wcm-template -->

<!-- wcm-template:glencairnGold -->
<path
  class="glencairn-gold"
  d="{{raw:gLENCAIRNINK}}"
  fill-rule="evenodd"
  clip-path="url(#{{raw:id}})"
  style="fill:{{raw:color}}"/>
<!-- /wcm-template -->


<!-- wcm-template:glencairnSymbol3 -->
<svg class="glencairn-symbol glencairn-rating-symbol" viewBox="130 50 220 355" aria-hidden="true" focusable="false">{{raw:children}}</svg>
<!-- /wcm-template -->

<!-- wcm-template:defs2 -->
<defs><clipPath id="{{raw:id}}"><path d="{{raw:gLENCAIRNCAVITY}}"/></clipPath></defs>
<!-- /wcm-template -->

<!-- wcm-template:glencairnRatingFill -->
<rect
  class="glencairn-rating-fill"
  data-rating-fill
  x="130"
  y="{{raw:y}}"
  width="220"
  height="{{raw:height}}"
  clip-path="url(#{{raw:id}})"/>
<!-- /wcm-template -->

<!-- wcm-template:glencairnRatingOutline -->
<path class="glencairn-rating-outline" d="{{raw:gLENCAIRNINK}}" fill-rule="evenodd"/>
<!-- /wcm-template -->
