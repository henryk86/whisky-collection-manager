<!-- wcm-template:flightPlanCaskDimension -->
<div class="flight-plan-cask-dimension" role="group" aria-label="{{attr:title}}"><span>{{content:title2}}</span>
  <div class="flight-plan-cask-choices">{{content:fields}}</div>
</div>
<!-- /wcm-template -->

<!-- wcm-template:flightPlanCaskRefinement -->
<details
  class="flight-plan-cask-refinement"
  data-flight-plan-cask-subtype-wrap="{{attr:group}}"
  hidden>
  <summary><span>{{content:title}}</span>
    <span class="flight-plan-cask-count" data-flight-plan-cask-count>{{content:all}}</span>{{content:chevronDownIcon}}
  </summary><div class="flight-plan-cask-dimensions">{{content:dimensions}}</div>
</details>
<!-- /wcm-template -->

<!-- wcm-template:phasesOption -->
<option value="{{attr:phase}}">{{content:text}}</option>
<!-- /wcm-template -->

<!-- wcm-template:flightPlanCaskFilter -->
<div class="flight-plan-cask-filter" data-flight-plan-cask-group-wrap hidden>
  <div
    class="form-field full"
    role="group"
    aria-label="{{attr:label}}"
    aria-describedby="flight-plan-cask-hint">
    <div class="flight-plan-cask-heading"><span>{{content:label2}}</span>{{content:reset}}</div>
    <span class="ds-field-description" id="flight-plan-cask-hint">{{content:hint}}</span>
    <div class="flight-plan-cask-choices">{{content:groups}}</div>
  </div>
  <div class="flight-plan-cask-details" data-flight-plan-cask-details hidden>
    <span class="flight-plan-cask-caption">{{text:t}}</span>{{content:details}}
  </div>
  <div class="flight-plan-options flight-plan-advanced-grid">
    <label>{{content:phaseLabel}}
      <select data-flight-plan-cask-phase>{{content:phases}}</select>
    </label>
  </div>
  <div class="flight-plan-cask-selection" aria-live="polite">
    <span class="flight-plan-cask-caption">{{text:t2}}</span>
    <span data-flight-plan-cask-selection>{{text:t3}}</span>
  </div>
</div>
<!-- /wcm-template -->
