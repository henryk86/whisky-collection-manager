<!-- wcm-template:glencairnSymbol -->
<svg class="glencairn-symbol" viewBox="130 50 220 355" {{attrs:roleAttributes}}>{{content:children}}</svg>
<!-- /wcm-template -->

<!-- wcm-template:defs -->
<defs><clipPath id="{{attr:id}}"><rect
      x="130"
      y="{{attr:y}}"
      width="220"
      height="{{attr:content}}"/></clipPath></defs>
<!-- /wcm-template -->

<!-- wcm-template:glencairnLiquid -->
<path class="glencairn-liquid" d="{{attr:cavityPath}}" style="fill:{{attr:liquidColor}}"/>
<!-- /wcm-template -->

<!-- wcm-template:glencairnInk -->
<path class="glencairn-ink" d="{{attr:glassOutlinePath}}" fill-rule="evenodd"/>
<!-- /wcm-template -->

<!-- wcm-template:glencairnGold -->
<path
  class="glencairn-gold"
  d="{{attr:glassOutlinePath}}"
  fill-rule="evenodd"
  clip-path="url(#{{attr:id}})"
  style="fill:{{attr:color}}"/>
<!-- /wcm-template -->


<!-- wcm-template:glencairnSymbol3 -->
<svg class="glencairn-symbol glencairn-rating-symbol" viewBox="130 50 220 355" aria-hidden="true" focusable="false">{{content:children}}</svg>
<!-- /wcm-template -->

<!-- wcm-template:defs2 -->
<defs><clipPath id="{{attr:id}}"><path d="{{attr:cavityPath}}"/></clipPath></defs>
<!-- /wcm-template -->

<!-- wcm-template:glencairnRatingFill -->
<rect
  class="glencairn-rating-fill"
  data-rating-fill
  x="130"
  y="{{attr:y}}"
  width="220"
  height="{{attr:height}}"
  clip-path="url(#{{attr:id}})"/>
<!-- /wcm-template -->

<!-- wcm-template:glencairnRatingOutline -->
<path class="glencairn-rating-outline" d="{{attr:glassOutlinePath}}" fill-rule="evenodd"/>
<!-- /wcm-template -->
