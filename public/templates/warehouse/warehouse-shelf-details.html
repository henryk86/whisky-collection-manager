<!-- wcm-template:warehouseBottleFact -->
<span class="warehouse-bottle-fact"><span class="warehouse-bottle-fact-label">{{content:label}}:</span> {{content:value}}</span>
<!-- /wcm-template -->

<!-- wcm-template:warehouseShelfDetailBottle -->
<article class="warehouse-shelf-detail-bottle" data-bottle-id="{{attr:bottleId}}">
  {{content:bottleSymbol}}
  <div class="warehouse-shelf-detail-info"><strong>{{content:name}}</strong><div class="warehouse-bottle-facts">{{content:facts}}{{content:bottleListFacts}}</div>
  </div>
  {{content:actionToolbar}}
</article>
<!-- /wcm-template -->

<!-- wcm-template:warehouseShelfDetailGrid -->
<div class="warehouse-shelf-detail-grid">{{content:bottles}}</div>
<!-- /wcm-template -->

<!-- wcm-template:hint -->
<p class="hint">{{t:warehouse.shelves.empty}}</p>
<!-- /wcm-template -->

<!-- wcm-template:warehouseShelfDetails -->
<div class="warehouse-shelf-details">
  <p>{{content:bottleCount}}</p>{{content:body}}</div>
<!-- /wcm-template -->
