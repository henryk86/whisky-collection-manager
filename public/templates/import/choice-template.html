<!-- wcm-template:importChoiceCurrent -->
<small class="import-choice-current">{{content:currentValue}}</small>
<!-- /wcm-template -->

<!-- wcm-template:importChoiceCurrent2 -->
<small class="import-choice-current">{{t:imports.preview.choiceNotFound}}</small>
<!-- /wcm-template -->

<!-- wcm-template:importChoice -->
<label class="import-choice">
  <input type="checkbox" {{attrs:attribute}}{{attrs:checkedAttributes}}{{attrs:disabledAttributes}}>
  <span class="import-choice-copy">
    <span class="import-choice-label">{{text:label}}</span>
    <span class="import-choice-value">{{text:value}}</span>
    {{content:existing}}{{content:importChoiceCurrent}}
  </span>
</label>
<!-- /wcm-template -->
