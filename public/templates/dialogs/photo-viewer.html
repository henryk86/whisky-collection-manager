<!-- wcm-template:photoPrev -->
<span class="photo-lightbox-navigation">
  <button
    type="button"
    class="btn small"
    data-act="photo-prev"
    aria-label="{{t:ui.photos.previous}}">{{content:arrowLeftIcon}}</button>
  <span class="photo-lightbox-count" aria-live="polite">{{content:active}} / {{content:length}}</span>
  <button
    type="button"
    class="btn small"
    data-act="photo-next"
    aria-label="{{t:ui.photos.next}}">{{content:arrowRightIcon}}</button>
</span>
<!-- /wcm-template -->

<!-- wcm-template:photoLightbox -->
<figure class="photo-lightbox">
  <div class="photo-lightbox-stage">
    <img
      class="photo-lightbox-image"
      src="{{text:src}}"
      alt="{{text:alt}}"
      draggable="false">
  </div>
  <figcaption class="photo-lightbox-footer">
    <span class="photo-lightbox-caption">{{text:caption}}</span>
    <span class="photo-lightbox-zoom" role="group" aria-label="{{t:ui.photos.zoomControls}}">
      <button
        type="button"
        class="btn small"
        data-act="photo-zoom-out"
        aria-label="{{t:ui.photos.zoomOut}}"
        disabled>{{content:minusIcon}}</button>
      <button
        type="button"
        class="btn small photo-lightbox-zoom-level"
        data-act="photo-zoom-reset"
        aria-label="{{t:ui.photos.zoomReset}}"
        disabled><span data-photo-zoom-level>100 %</span></button>
      <button
        type="button"
        class="btn small"
        data-act="photo-zoom-in"
        aria-label="{{t:ui.photos.zoomIn}}">{{content:plusIcon}}</button>
    </span>
    {{content:photoPrev}}
  </figcaption>
</figure>
<!-- /wcm-template -->
