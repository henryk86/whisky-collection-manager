<!-- wcm-template:overlay -->
<div class="overlay ds-modal-overlay" data-overlay="1">
  <div
    class="{{raw:classes}}"
    role="dialog"
    aria-modal="true"
    aria-labelledby="ds-modal-title"
    aria-label="{{text:title}}"
    tabindex="-1">
    {{raw:sectionHeader}}
    <div class="ds-modal-body">{{raw:content}}</div>
  </div>
</div>
<!-- /wcm-template -->

<!-- wcm-template:actions -->
<div class="actions ds-modal-footer{{raw:className}}">{{raw:actions}}</div>
<!-- /wcm-template -->
