<!-- wcm-template:overlay -->
<div class="overlay ds-modal-overlay" data-overlay="1">
  <div
    class="{{attr:classes}}"
    role="dialog"
    aria-modal="true"
    aria-labelledby="ds-modal-title"
    aria-label="{{text:title}}"
    tabindex="-1">
    {{content:sectionHeader}}
    <div class="ds-modal-body">{{content:content}}</div>
  </div>
</div>
<!-- /wcm-template -->

<!-- wcm-template:actions -->
<div class="actions ds-modal-footer{{attr:className}}">{{content:actions}}</div>
<!-- /wcm-template -->
