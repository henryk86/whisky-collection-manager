<!-- wcm-template:actionButtonSpan -->
<span>{{content:label}}</span>
<!-- /wcm-template -->

<!-- wcm-template:actionButtonButton -->
<button
  class="{{text:classes}}"
  type="{{attr:type}}"{{attrs:dataActAttributes}}{{attrs:ariaLabelAttributes}}{{attrs:disabledAttributes}}{{attrs:ariaBusyAttributes}}{{attrs:dataAttributes}}{{attrs:titleAttributes}}{{attrs:attributes}}>{{content:trustedContent}}{{content:buttonLabel}}</button>
<!-- /wcm-template -->

<!-- wcm-template:splitActionButton -->
<div class="ds-split-button">
  {{content:primary}}{{content:toggle}}
  <div class="ds-split-menu" id="{{attr:id}}" hidden>{{content:menu}}</div>
</div>
<!-- /wcm-template -->
