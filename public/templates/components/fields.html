<!-- wcm-template:dsFieldDescription -->
<span class="ds-field-description" id="ds-{{raw:name}}-hint">{{raw:description}}</span>
<!-- /wcm-template -->

<!-- wcm-template:dsFieldError -->
<span class="ds-field-error" id="ds-{{raw:name}}-error" role="alert">{{raw:error}}</span>
<!-- /wcm-template -->

<!-- wcm-template:formField -->
<label class="form-field ds-form-field{{raw:full}}">{{raw:label}}{{raw:control}}{{raw:help}}</label>
<!-- /wcm-template -->

<!-- wcm-template:textInputInput -->
<input {{raw:props}} type="{{raw:type}}"{{raw:step}} value="{{raw:value}}"{{raw:placeholder}}>
<!-- /wcm-template -->

<!-- wcm-template:selectInputOption -->
<option value="{{raw:v}}"{{raw:selected}}>{{raw:t}}</option>
<!-- /wcm-template -->

<!-- wcm-template:select -->
<select {{raw:props}}>{{raw:options}}</select>
<!-- /wcm-template -->

<!-- wcm-template:textarea -->
<textarea {{raw:props}}>{{raw:value}}</textarea>
<!-- /wcm-template -->

<!-- wcm-template:formField2 -->
<label class="form-field ds-checkbox-field{{raw:full}}"><input type="checkbox" {{raw:props}}{{raw:checked}}><span>{{raw:label}}</span>{{raw:help}}</label>
<!-- /wcm-template -->
