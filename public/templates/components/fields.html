<!-- wcm-template:dsFieldDescription -->
<span class="ds-field-description" id="ds-{{attr:name}}-hint">{{content:description}}</span>
<!-- /wcm-template -->

<!-- wcm-template:dsFieldError -->
<span class="ds-field-error" id="ds-{{attr:name}}-error" role="alert">{{content:error}}</span>
<!-- /wcm-template -->

<!-- wcm-template:formField -->
<label class="form-field ds-form-field{{attr:full}}">{{content:label}}{{content:control}}{{content:help}}</label>
<!-- /wcm-template -->

<!-- wcm-template:textInputInput -->
<input {{attrs:props}} type="{{attr:type}}"{{attrs:stepAttributes}} value="{{attr:value}}"{{attrs:placeholderAttributes}}>
<!-- /wcm-template -->

<!-- wcm-template:selectInputOption -->
<option value="{{attr:v}}"{{attrs:selectedAttributes}}>{{content:t}}</option>
<!-- /wcm-template -->

<!-- wcm-template:select -->
<select {{attrs:props}}>{{content:options}}</select>
<!-- /wcm-template -->

<!-- wcm-template:textarea -->
<textarea {{attrs:props}}>{{content:value}}</textarea>
<!-- /wcm-template -->

<!-- wcm-template:formField2 -->
<label class="form-field ds-checkbox-field{{attr:full}}"><input type="checkbox" {{attrs:props}}{{attrs:checkedAttributes}}><span>{{content:label}}</span>{{content:help}}</label>
<!-- /wcm-template -->
